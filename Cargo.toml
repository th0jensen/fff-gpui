[package]
name = "fff-gpui"
version = "0.1.7"
edition = "2024"

[dependencies]
gpui = { version = "*" }
fff-search = { version = "0.11", features = ["zlob"] }
fff-query-parser = { version = "0.11", features = ["zlob"] }
fff-grep = { version = "0.11" }
smol = "2"
unicode-segmentation = "1"
anyhow = "1"
async-channel = "2"
global-hotkey = "0.8.0"
serde = { version = "1", features = ["derive"] }
json5 = "0.4"
serde_json = "1"
toml = "0.8"
rust-embed = "8"
# Syntax highlighting is provided by the `bat` CLI instead of tree-sitter.
mimalloc = "0.1"
objc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indoc = "2.0.7"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unused_must_use = "deny"


[profile.dev]
opt-level = 1
